Here’s a tiny, minimal Ducati landing page. Save it as `ducati.html` and open it in your browser. It uses a text wordmark, so you don’t need an image file.

```html
<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ducati — Made for the Ride</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #111;
      color: #f5f5f5;
      font-family: Arial, sans-serif;
    }
    main { text-align: center; padding: 2rem; }
    .brand {
      color: #e60012;
      font-size: .8rem;
      font-weight: bold;
      letter-spacing: .35em;
    }
    h1 {
      margin: 1rem 0 .5rem;
      font-size: clamp(2.5rem, 10vw, 5rem);
      letter-spacing: .08em;
    }
    p { color: #aaa; }
    a {
      display: inline-block;
      margin-top: 1.5rem;
      padding: .8rem 1.2rem;
      border: 1px solid #e60012;
      color: white;
      text-decoration: none;
    }
    a:hover { background: #e60012; }
  </style>
</head>
<body>
  <main>
    <div class="brand">ITALIAN PERFORMANCE</div>
    <h1>DUCATI</h1>
    <p>Made for the ride.</p>
    <a href="https://www.ducati.com/">Explore Ducati</a>
  </main>
</body>
</html>
```

<!doctype html>
<html>
  <head>
    <title>My saved list</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 650px;
        margin: 60px auto;
        padding: 0 20px;
        background: #f4f0e8;
        color: #242424;
      }

      h1 { color: #315c54; }

      input, button {
        font: inherit;
        padding: 8px;
      }

      li { margin: 10px 0; }
    </style>
  </head>
  <body>
    <h1>My saved list</h1>
    <p>Add an idea, project, or anything you want to remember.</p>

    <form id="item-form">
      <input id="item-input" placeholder="Write an item" required>
      <button>Add</button>
    </form>
<button id="clear-button" type="button">Clear list</button>

    <ul id="item-list"></ul>

    <script>
      const form = document.querySelector("#item-form");
      const input = document.querySelector("#item-input");
      const list = document.querySelector("#item-list");

      let items = JSON.parse(localStorage.getItem("myItems") || "[]");

      function showItems() {
        list.replaceChildren();

        items.forEach(function (item) {
          const row = document.createElement("li");
          row.textContent = item;
          list.appendChild(row);
        });
      }

      form.addEventListener("submit", function (event) {
        event.preventDefault();
        items.push(input.value.trim());
        localStorage.setItem("myItems", JSON.stringify(items));
        input.value = "";
        showItems();
      });
document.querySelector("#clear-button").addEventListener("click", function () {
  items = [];
  localStorage.removeItem("myItems");
  showItems();
});

      showItems();
    </script>
  </body>
</html>
